<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>我的个人主页 | My Personal Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* 基础排版与背景 */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background: #f5f5f7;
      color: #222;
    }

    /* 顶部区域 */
    header {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      position: relative;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 2rem;
    }

    header p {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: #555;
    }

    /* 顶部导航 */
    nav {
      margin-top: 0.75rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    nav a {
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      border: 1px solid transparent;
      color: #555;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    nav a:hover {
      background: #f0f0f5;
      border-color: #d0d0e0;
      color: #111;
    }

    /* 页面主体与卡片布局 */
    main {
      max-width: 960px;
      margin: 2rem auto 3rem;
      padding: 0 1.5rem;
    }

    .section-wrapper {
      margin-bottom: 2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    /* 每个 section 的标题 + 图标 */
    .section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0;
      margin-bottom: 1rem;
    }

    .section-icon {
      font-size: 1.4rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin: 0;
    }

    /* 列表与条目统一样式 */
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .item-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .item-list li:last-child {
      border-bottom: none;
    }

    .item-list strong {
      display: inline-block;
      font-weight: 600;
      margin-right: 0.25rem;
    }

    /* 教育经历采用稍微紧凑的风格 */
    .edu-list li {
      padding: 0.5rem 0;
    }

    .edu-list strong {
      display: block;
      margin-bottom: 0.1rem;
    }

    /* 联系方式 */
    #contact a {
      color: #3366cc;
      text-decoration: none;
    }

    #contact a:hover {
      text-decoration: underline;
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 1rem 0 1.5rem;
      border-top: 1px solid #e0e0e0;
      font-size: 0.85rem;
      color: #777;
      background: #ffffff;
    }

    /* 语言切换按钮区域 */
    .lang-switch {
      position: absolute;
      top: 1rem;
      right: 1rem;
    }

    .lang-switch button {
      margin-left: 0.5rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 0.85rem;
      min-width: 48px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .lang-switch button.active {
      font-weight: 600;
      border-color: #333;
      background: #e8e8ee;
      color: #111;
    }

    /* 自适应小屏 */
    @media (max-width: 600px) {
      header {
        padding-top: 1.5rem;
      }
      main {
        padding: 0 1rem;
      }
      .card {
        padding: 1.25rem 1.25rem;
      }
    }

    .about-section {
  margin-bottom: 2.5rem;
}

.about-container {
  display: flex;
  align-items: flex-start;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.profile-photo {
  width: 240px;
  height: 240px;
  border-radius: 70%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid #ddd;
}

/* 小屏幕时让布局更舒服 */
@media (max-width: 600px) {
  .about-container {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .profile-photo {
    width: 140px;
    height: 140px;
  }
}
  </style>
</head>

    // 设置语言的函数
    function setLanguage(lang) {
      const dict = translations[lang];
      if (!dict) return;

      // 改 html 标签上的 lang 属性，利于搜索引擎和可访问性
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

      // 找到所有带 data-i18n 属性的元素，替换文本（支持 HTML）
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });

      // 按钮高亮状态
      document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
    }

    // 默认加载英文
