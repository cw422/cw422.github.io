<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chuxinyao Wang | Personal Homepage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --accent: #3b5cff;
      --accent-soft: #e3e7ff;
      --text-main: #222222;
      --text-muted: #666666;
      --border-soft: #e4e4e7;
      --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.06);
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text-main);
    }

    /* 顶部 Header */
    header {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(245, 245, 247, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(228, 228, 231, 0.7);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.9rem;
      margin: 0.2rem 0;
    }

    .subtitle {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin: 0.1rem 0 0.4rem;
    }

    /* 导航 */
    nav {
      margin-top: 0.75rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    nav a {
      margin: 0;
      padding: 0.25rem 0.85rem;
      text-decoration: none;
      font-size: 0.92rem;
      color: var(--text-muted);
      border-radius: 999px;
      border: 1px solid transparent;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    nav a:hover {
      background: var(--card-bg);
      border-color: var(--accent-soft);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* 语言切换按钮 */
    .lang-switch {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.4rem;
    }

    .lang-switch button {
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: var(--card-bg);
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
    }

    .lang-switch button:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .lang-switch button.active {
      font-weight: 600;
      border-color: var(--accent);
      color: var(--accent);
      background: #ffffff;
    }

    /* 整体布局 */
    main {
      max-width: 980px;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem 0.5rem;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 1.6rem 1.8rem;
      box-shadow: var(--shadow-soft);
      margin-bottom: 1.5rem;
      border: 1px solid rgba(228, 228, 231, 0.7);
    }

    .section-card h2 {
      margin-top: 0;
      margin-bottom: 0.75rem;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: -0.3rem;
      margin-bottom: 0.8rem;
    }

    /* About 区域：头像 + 文本 */
    .about-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-start;
    }

    .about-photo {
      flex: 0 0 160px;
      display: flex;
      justify-content: center;
    }

    .about-photo img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border-soft);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      background: #ddd;
    }

    .about-text {
      flex: 1 1 260px;
      min-width: 0;
    }

    .about-text p {
      margin-top: 0.2rem;
    }

    /* 列表卡片样式（研究兴趣 / 教育 / 项目） */
    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .item-card {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      background: #fafafa;
      border: 1px solid rgba(228, 228, 231, 0.9);
      position: relative;
      overflow: hidden;
    }

    .item-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, var(--accent), #a855f7);
    }

    .item-card strong {
      font-size: 0.96rem;
    }

    .item-card span {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .item-card .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* 联系方式 */
    #contact p {
      margin: 0.25rem 0;
      font-size: 0.95rem;
    }

    a {
      color: var(--accent);
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 1.2rem 0 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 响应式 */
    @media (max-width: 720px) {
      header {
        padding-top: 2.5rem;
      }
      .lang-switch {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        z-index: 20;
        background: rgba(245, 245, 247, 0.9);
        padding: 0.2rem 0.4rem;
        border-radius: 999px;
        border: 1px solid rgba(228, 228, 231, 0.9);
      }
      .about-layout {
        flex-direction: column;
        align-items: center;
        text-align: left;
      }
      .about-text {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="lang-switch">
      <button id="btn-zh" onclick="setLanguage('zh')">中文</button>
      <button id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="header-inner">
      <h1 data-i18n="name"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <nav>
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#projects" data-i18n="nav_projects"></a>
        <a href="#ongoingprojects" data-i18n="nav_ongoingprojects"></a>
        <a href="#education" data-i18n="nav_education"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>
    </div>
  </header>

  <main>
    <!-- About -->
    <section id="about" class="section-card">
      <div class="about-layout">
        <div class="about-photo">
          <!-- 头像文件的名字 -->
          <img src="Chuxinyao Wang Hoch.jpg" alt="Portrait of Chuxinyao Wang">
        </div>
        <div class="about-text">
          <h2 data-i18n="about_title"></h2>
          <p data-i18n="about_text"></p>
        </div>
      </div>
    </section>

    <!-- Research interests -->
    <section id="projects" class="section-card">
      <h2 data-i18n="projects_title"></h2>
      <ul class="item-list">
        <li class="item-card">
          <strong data-i18n="project1_title"></strong>
          <span data-i18n="project1_desc"></span>
        </li>
        <li class="item-card">
          <strong data-i18n="project2_title"></strong>
          <span data-i18n="project2_desc"></span>
        </li>
        <li class="item-card">
          <strong data-i18n="project3_title"></strong>
          <span data-i18n="project3_desc"></span>
        </li>
        <li class="item-card">
          <strong data-i18n="project4_title"></strong>
          <span data-i18n="project4_desc"></span>
        </li>
        <li class="item-card">
          <strong data-i18n="project5_title"></strong>
          <span data-i18n="project5_desc"></span>
        </li>
      </ul>
    </section>

    <!-- Ongoing projects -->
    <section id="ongoingprojects" class="section-card">
      <h2 data-i18n="oprojects_title"></h2>
      <ul class="item-list">
        <li class="item-card">
          <strong data-i18n="oproject1_title"></strong>
          <span data-i18n="oproject1_desc"></span>
        </li>
      </ul>
    </section>

    <!-- Education -->
    <section id="education" class="section-card">
      <h2 data-i18n="edu_title"></h2>
      <ul class="item-list">
        <li class="item-card">
          <strong data-i18n="edu_phd_title"></strong>
          <div class="item-meta" data-i18n="edu_phd_desc"></div>
        </li>
        <li class="item-card">
          <strong data-i18n="edu_master_title"></strong>
          <div class="item-meta" data-i18n="edu_master_desc"></div>
        </li>
        <li class="item-card">
          <strong data-i18n="edu_bachelor_title"></strong>
          <div class="item-meta" data-i18n="edu_bachelor_desc"></div>
        </li>
      </ul>
    </section>

    <!-- Contact -->
    <section id="contact" class="section-card">
      <h2 data-i18n="contact_title"></h2>
      <p>
        <span data-i18n="contact_email_label"></span>
        <a href="mailto:chuxinyao.wang@eawag.ch">chuxinyao.wang@eawag.ch</a>
      </p>
      <p>
        <span data-i18n="contact_other_label"></span>
        <a href="https://github.com/cw422" target="_blank">GitHub</a>
      </p>
    </section>
  </main>

  <footer>
    <p data-i18n="footer_text"></p>
  </footer>

    function setLanguage(lang) {
      const dict = translations[lang];
      if (!dict) return;

      document.documentElement.lang = (lang === "zh") ? "zh-CN" : "en";

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) {
          el.innerHTML = dict[key]; // 支持 HTML
        }
      });

      document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
    }

    // 默认英文
    setLanguage("en");

</body>
</html>
